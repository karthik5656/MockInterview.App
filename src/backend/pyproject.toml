[project]
name = "mockinterview-backend"
version = "0.1.0"
description = "FastAPI backend for AI Mock Interview Application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "python-multipart>=0.0.9",
    "azure-storage-queue>=12.10.0",
    "openai>=1.40.0",
    "faster-whisper>=1.0.3",
    "httpx>=0.27.0",
    "psycopg>=3.3.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
